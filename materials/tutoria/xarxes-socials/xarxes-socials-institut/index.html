<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%23fbbf24'/%3E%3Cstop offset='.45' stop-color='%23ec4899'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='13' fill='url(%23g)'/%3E%3Cpath d='M24 11c-7.2 0-13 5-13 11.3 0 3.5 1.8 6.6 4.6 8.7-.1 1.8-.8 3.5-2 4.9 2.5-.2 4.7-1.1 6.4-2.4 1.3.3 2.6.5 4 .5 7.2 0 13-5 13-11.3S31.2 11 24 11z' fill='none' stroke='%23fff' stroke-width='3' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='22.5' r='4.2' fill='%23fff'/%3E%3Ccircle cx='33' cy='15' r='1.9' fill='%23fff'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instaxat · Tutoria sobre xarxes socials</title>
<meta name="author" content="Nil Bellmunt, professor de l'Institut Ermengol IV de Bellcaire">
<meta name="description" id="metaDesc" content="Activitat de tutoria per a 2n d'ESO: el teu temps a les xarxes i detectius de privacitat. Tot passa al navegador, no es guarda res.">
<style>
:root{
  --bg:#fbf8ff; --surface:#ffffff; --ink:#1d1633; --muted:#574f70; --line:#e4dcf5;
  --brand:#5b21b6; --brand-2:#7c3aed; --social:#e0156f; --social-soft:#ffe3f0;
  --lived:#6d6890; --left:#ebe6f7; --good:#047857; --warn:#b45309; --bad:#be123c;
  --blue:#2563eb; --green:#059669; --amber:#d97706;
  --grad:linear-gradient(135deg,#f59e0b 0%,#ec4899 50%,#7c3aed 100%);
  --radius:20px;
  --shadow:0 8px 28px rgba(60,30,120,.10);
}
*{box-sizing:border-box}
html{font-size:clamp(16px,.55vw + 11px,24px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;line-height:1.35;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px;border-radius:6px}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#stage{overflow:hidden}
#printSheet,.svg-sprite{display:none}
.svg-sprite{display:block;position:absolute;width:0;height:0;overflow:hidden}

/* ---------- Capçalera ---------- */
.top{display:flex;align-items:center;gap:clamp(8px,1.6vw,22px);padding:.55rem clamp(12px,2vw,28px);background:var(--surface);border-bottom:1px solid var(--line);flex:0 0 auto}
.logo{display:flex;align-items:center;gap:.5rem;font-weight:900;font-size:1.2rem;letter-spacing:-.01em;white-space:nowrap}
.logo svg{width:2.1rem;height:2.1rem;display:block}
.chip{display:inline-block;padding:.25em .8em;border-radius:99px;background:#efe7ff;color:var(--brand);font-weight:800;font-size:.85rem;white-space:nowrap}
.prog{flex:1;display:flex;gap:4px;min-width:60px}
.prog button{flex:1;height:22px;border:0;padding:0;background:transparent;cursor:pointer;position:relative}
.prog button::after{content:"";position:absolute;left:0;right:0;top:50%;height:8px;transform:translateY(-50%);border-radius:99px;background:var(--line);transition:background .3s,height .2s}
.prog button.done::after{background:var(--brand-2)}
.prog button.cur::after{background:var(--grad);height:12px}
.prog button.p2.done::after{background:var(--social)}
.prog button.p3.done::after{background:var(--green)}
.clock{font-weight:800;font-size:.95rem;white-space:nowrap;color:var(--muted)}
.clock b{color:var(--ink);font-size:1.15em}
.lang{display:inline-flex;flex:0 0 auto;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
.lang button{border:0;background:transparent;padding:.2em .7em;min-height:1.9rem;font-weight:800;font-size:.85rem;cursor:pointer}
.lang button:hover:not([aria-pressed="true"]){background:#efe7ff}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ---------- Escena i navegació ---------- */
#stage{flex:1 1 auto;min-height:0;position:relative}
.slide{height:100%;overflow:auto;padding:clamp(14px,2vw,30px) clamp(16px,3.4vw,56px) clamp(18px,2.4vw,34px)}
.slide[hidden]{display:none!important}
.slide.enter{animation:slideIn .38s ease both}
@keyframes slideIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.slide > h1:focus,.slide h1[tabindex="-1"]:focus{outline:none}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:.6rem clamp(12px,2vw,28px);background:var(--surface);border-top:1px solid var(--line);flex:0 0 auto}
.nav .mid{flex:1;text-align:center;color:var(--muted);font-size:.85rem}
.nav .mid .keys{display:block}
.btn{font-weight:800;font-size:1.1rem;padding:.65em 1.5em;border-radius:99px;border:2.5px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;transition:transform .15s,background .15s;min-height:3rem}
.btn:hover:not(:disabled){transform:translateY(-2px);background:#f4efff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover:not(:disabled){background:#4c1d95}
.btn.small{font-size:.9rem;padding:.4em 1em;min-height:2.4rem;border-width:2px}
.btn.pink{background:var(--social);border-color:var(--social);color:#fff}

/* ---------- Tipografia comuna ---------- */
.kicker{display:inline-block;font-weight:800;color:var(--brand);background:#efe7ff;border-radius:99px;padding:.2em .85em;font-size:.9rem;margin-bottom:.6rem}
.slide h1{font-size:clamp(1.7rem,3.6vw,3.2rem);line-height:1.08;font-weight:900;letter-spacing:-.02em;margin-bottom:.4rem}
.lead{font-size:clamp(1.05rem,1.7vw,1.5rem);color:var(--muted);max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
strong{font-weight:800}

/* ---------- Títol ---------- */
.title-wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.1rem;position:relative}
.title-wrap .biglogo{width:clamp(80px,12vw,140px);height:clamp(80px,12vw,140px)}
.title-wrap h1{font-size:clamp(2rem,5.4vw,4.6rem);max-width:18ch}
.title-wrap .small{font-size:.9rem;color:var(--muted)}
.title-wrap .author{color:var(--ink);margin-top:-.4rem}
.floaty{position:absolute;font-size:clamp(1.6rem,4vw,3.4rem);opacity:.9;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px) rotate(6deg)}}

/* ---------- Control d'hores ---------- */
.hctl{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:clamp(8px,1.4vw,20px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem clamp(12px,1.6vw,24px);box-shadow:var(--shadow)}
.stepbtn{width:3.4rem;height:3.4rem;border-radius:50%;border:2.5px solid var(--ink);background:#fff;font-size:2rem;font-weight:900;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.stepbtn:hover{background:var(--social-soft)}
.agectl{display:inline-flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:.25rem .5rem .25rem 1rem;box-shadow:var(--shadow)}
.agectl .al{font-weight:800;color:var(--muted);font-size:.95rem}
.agectl .av2{min-width:4.6rem;text-align:center;font-weight:700;font-size:1rem}
.agectl .av2 b{font-size:1.6rem;font-weight:900;color:var(--brand)}
.agebtn{width:2.5rem;height:2.5rem;border-radius:50%;border:2.5px solid var(--ink);background:#fff;font-size:1.5rem;font-weight:900;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.agebtn:hover{background:#efe7ff}
.rangewrap{position:relative;padding-bottom:1.3rem}
.rangewrap input{-webkit-appearance:none;appearance:none;width:100%;height:2.4rem;background:transparent;margin:0;cursor:pointer;--p:37.5%}
.rangewrap input::-webkit-slider-runnable-track{height:.9rem;border-radius:99px;background:linear-gradient(90deg,var(--social) var(--p),#ddd4f1 var(--p))}
.rangewrap input::-moz-range-track{height:.9rem;border-radius:99px;background:linear-gradient(90deg,var(--social) var(--p),#ddd4f1 var(--p))}
.rangewrap input::-webkit-slider-thumb{-webkit-appearance:none;width:2.4rem;height:2.4rem;border-radius:50%;background:#fff;border:.35rem solid var(--social);margin-top:-.75rem;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.rangewrap input::-moz-range-thumb{width:1.7rem;height:1.7rem;border-radius:50%;background:#fff;border:.35rem solid var(--social);box-shadow:0 3px 10px rgba(0,0,0,.25)}
.ticks{position:absolute;left:1.2rem;right:1.2rem;bottom:0;display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-weight:700;pointer-events:none}
.hval{min-width:5.6rem;text-align:center;line-height:1}
.hval .hv{font-size:clamp(2rem,4vw,3.4rem);font-weight:900;color:var(--social);font-variant-numeric:tabular-nums}
.hval small{display:block;font-size:.85rem;color:var(--muted);font-weight:700;margin-top:.15rem}

/* ---------- Calculadora ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:clamp(10px,1.4vw,18px);margin-top:1.1rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem;box-shadow:var(--shadow)}
.stat .num{font-size:clamp(2.2rem,4.6vw,4.2rem);font-weight:900;line-height:1;color:var(--social);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .unit{margin-top:.35rem;font-weight:700;color:var(--muted);font-size:1rem}
.stat.hero{background:linear-gradient(135deg,#6d28d9,#c026d3);border:0}
.stat.hero .num,.stat.hero .unit{color:#fff}
.stat.hero .unit{opacity:.95}
.callout{margin-top:1.1rem;padding:.9rem 1.2rem;border-radius:var(--radius);background:#fff7e6;border:1px solid #f3d9a0;font-size:1.05rem}
.fine{font-size:.82rem;color:var(--muted);margin-top:.8rem}

/* ---------- Vida ---------- */
.lifewrap{display:grid;grid-template-columns:auto 1fr;gap:.6rem;margin-top:1rem;align-items:stretch}
.rowlab{display:grid;grid-template-rows:repeat(4,1fr);gap:4px;font-size:.8rem;font-weight:800;color:var(--muted);text-align:right}
.rowlab span{display:flex;align-items:center;justify-content:flex-end}
.lifegrid{display:grid;grid-template-columns:repeat(20,1fr);gap:4px}
.cell{aspect-ratio:1;border-radius:4px;background:linear-gradient(to top,var(--social) calc(var(--f,0) * 100%),var(--left) 0);box-shadow:inset 0 0 0 1px rgba(60,30,120,.14);transition:background .25s;display:grid;place-items:center;font-size:clamp(.55rem,1.05vw,.95rem);font-weight:800;line-height:1;color:var(--ink);text-shadow:0 0 2px rgba(255,255,255,.85);font-variant-numeric:tabular-nums}
.cell.lived{background:var(--lived);box-shadow:none;color:#fff;text-shadow:none}
.cell.pk{color:#fff;text-shadow:0 0 2px rgba(0,0,0,.4)}
.cell.now{outline:3px solid var(--ink);outline-offset:1px;position:relative;z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:.5rem 1.4rem;margin-top:.9rem;font-weight:700;font-size:.95rem}
.legend span{display:inline-flex;align-items:center;gap:.45rem}
.legend i{width:1.1rem;height:1.1rem;border-radius:4px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(60,30,120,.2)}
.seg{display:inline-flex;border:2.5px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:.35em 1em;font-weight:800;cursor:pointer;font-size:.95rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.sentence{font-size:clamp(1.1rem,1.9vw,1.7rem);font-weight:600;margin-top:.9rem;line-height:1.3}
.sentence strong{color:var(--social)}
.row-between{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;justify-content:space-between}

/* ---------- Comparacions ---------- */
.bars{display:grid;gap:.75rem;margin-top:1rem}
.barrow{display:grid;grid-template-columns:minmax(120px,22%) 1fr;gap:.8rem;align-items:center}
.barrow .lab{font-weight:800;line-height:1.15}
.barrow .lab small{display:block;font-weight:600;color:var(--muted);font-size:.78rem}
.track{background:#eee9f8;border-radius:12px;height:2.6rem;position:relative;overflow:hidden}
.fill{height:100%;border-radius:12px;display:flex;align-items:center;justify-content:flex-end;padding-right:.7rem;color:#fff;font-weight:900;white-space:nowrap;transition:width .5s cubic-bezier(.2,.8,.2,1);min-width:0}
.fill.social{background:var(--social)} .fill.cls{background:var(--blue)} .fill.sleep{background:#4338ca} .fill.extra{background:var(--green)}
.barrow .track .outval{position:absolute;top:50%;transform:translateY(-50%);font-weight:900;color:var(--ink);padding-left:.5rem;left:var(--w);white-space:nowrap}
.equivs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin-top:.7rem}
.cmpgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 clamp(14px,2vw,30px)}
@media (min-width:1000px){ .cmpgrid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)} .equivs{grid-template-columns:repeat(2,minmax(0,1fr))} .equiv .em{font-size:1.8rem} }
.equiv{padding:.8rem 1rem;display:flex;align-items:center;gap:.8rem}
.equiv .em{font-size:2.2rem}
.equiv .n{font-size:clamp(1.6rem,3vw,2.6rem);font-weight:900;color:var(--social);line-height:1;font-variant-numeric:tabular-nums}
.equiv small{display:block;color:var(--muted);font-weight:600;font-size:.82rem;line-height:1.2;margin-top:.15rem}
.keyline{margin-top:.9rem;font-size:clamp(1.05rem,1.8vw,1.5rem);font-weight:700}
.keyline strong{color:var(--social)}

/* ---------- Mode classe ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(12px,2vw,28px);margin-top:1rem;align-items:start}
textarea.cls{width:100%;min-height:9rem;border:2.5px solid var(--ink);border-radius:16px;padding:.8rem 1rem;font-size:1.2rem;resize:vertical;background:#fff}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.7rem}
.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mini{padding:.7rem .5rem;text-align:center}
.mini b{display:block;font-size:clamp(1.6rem,3vw,2.6rem);font-weight:900;color:var(--brand);line-height:1.05}
.mini span{font-size:.85rem;font-weight:700;color:var(--muted)}
.hist{display:grid;grid-template-columns:repeat(8,1fr);gap:clamp(4px,.8vw,10px);align-items:end;height:clamp(150px,26vh,260px);margin-top:1rem;padding:.4rem .2rem 0;border-bottom:3px solid var(--ink)}
.hbar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.hbar .b{width:100%;background:var(--social);border-radius:8px 8px 0 0;min-height:0;transition:height .4s;position:relative}
.hbar .c{font-weight:900;font-size:1.1rem;margin-bottom:.15rem}
.histlab{display:grid;grid-template-columns:repeat(8,1fr);gap:clamp(4px,.8vw,10px);text-align:center;font-weight:700;font-size:.85rem;color:var(--muted);margin-top:.3rem}
.empty{color:var(--muted);text-align:center;padding:1.2rem}

/* ---------- Reflexió ---------- */
.reflect{font-size:clamp(1.6rem,4vw,3.4rem);font-weight:900;line-height:1.12;letter-spacing:-.02em;padding:clamp(1rem,3vw,2.4rem);border-radius:28px;background:var(--grad);color:#fff;margin:1rem 0;text-shadow:0 2px 8px rgba(60,10,90,.45)}
.reflect:focus{outline:4px solid var(--ink);outline-offset:4px}
.qlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin-top:.8rem}
.q{padding:1rem 1.2rem;font-size:1.1rem;font-weight:600;display:flex;gap:.7rem;align-items:flex-start}
.q i{font-style:normal;font-size:1.6rem}

/* ---------- Detectius ---------- */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin:1.1rem 0;counter-reset:s}
.step{padding:1rem 1.1rem 1rem 3.4rem;position:relative;font-weight:600;font-size:1.05rem}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:.9rem;top:.9rem;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--brand);color:#fff;font-weight:900;display:grid;place-items:center}
.notice{padding:.8rem 1.1rem;border-radius:16px;background:#e8f7ef;border:1px solid #a7e1c3;font-weight:600}
.tip{padding:.8rem 1.1rem;border-radius:16px;background:#fff7e6;border:1px solid #f3d9a0;margin-top:.7rem;font-weight:600}

.phead{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;margin-bottom:.7rem}
.av{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;flex:0 0 auto;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.phead .who{line-height:1.1}
.phead .who b{font-size:1.35rem;font-weight:900}
.phead .who span{color:var(--muted);font-weight:700}
.phead .bio{font-size:1rem;font-weight:600}
.phead .actions{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.pbody{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.feed{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start}
.post{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.ptop{display:flex;align-items:center;gap:.5rem;padding:.45rem .7rem;font-size:.9rem}
.ptop .av{width:1.9rem;height:1.9rem;font-size:1rem;border-width:2px}
.ptop b{font-weight:800}
.ptop .when{margin-left:auto;color:var(--muted);font-size:.8rem}
.scene{height:clamp(120px,18vh,300px);display:flex;align-items:center;justify-content:center}
.scene svg{width:100%;height:100%;display:block}
.pcap{padding:.5rem .8rem .7rem;font-size:.95rem;line-height:1.35}
.pcap .place{font-weight:700;color:var(--muted);margin-bottom:.2rem;font-size:.88rem}
.pcap .likes{font-weight:800;font-size:.85rem;color:var(--muted);margin-bottom:.15rem}
.pcap .coms{list-style:none;margin:.4rem 0 0;padding:.4rem 0 0;border-top:1px dashed var(--line);display:grid;gap:.2rem;font-size:.9rem}
.pcap .coms b{font-weight:800}
.clue{background:none;border:0;border-bottom:2px dotted #db2777;padding:0 1px;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit;display:inline;border-radius:2px}
.clue:hover{background:var(--social-soft)}
.clue.on{background:#ffd0e6;border-bottom:2px solid var(--social);font-weight:800}
.nohints .clue:not(.on){border-bottom-color:transparent}
.sclue{cursor:pointer}
.sclue .hit{fill:transparent;stroke:transparent;stroke-width:.8}
.hints .sclue .hit{stroke:rgba(219,39,119,.85);stroke-dasharray:1.6 1.6}
.sclue:hover .hit{fill:rgba(236,72,153,.25)}
.sclue.on .hit{fill:rgba(236,72,153,.35);stroke:#db2777;stroke-width:1.2;stroke-dasharray:none}
.sclue:focus-visible{outline:none}
.sclue:focus-visible .hit{stroke:#2563eb;stroke-width:1.4;stroke-dasharray:none}
.stag rect{fill:#fff;stroke:#1d1633;stroke-width:.5}
.stag text{fill:#1d1633;font-weight:800;font-family:"Segoe UI",system-ui,Arial,sans-serif}
.stag.jersey rect{fill:#ea580c;stroke:#fff;stroke-width:.8}
.stag.jersey text{fill:#fff}
.stag.blue rect{fill:#0369a1;stroke:#fff;stroke-width:.8}
.stag.blue text{fill:#fff}
.stag.dark rect{fill:rgba(20,16,40,.88);stroke:#fff;stroke-width:.4}
.stag.dark text{fill:#fff}
.stag.live rect{fill:#dc2626;stroke:#fff;stroke-width:.6}
.stag.live text{fill:#fff}
.stag.paper rect{fill:#fffbe6;stroke:#a16207;stroke-width:.5}
.hints .sclue.tg rect{stroke-dasharray:1.8 1.2}
.sclue.tg.on rect{stroke:#db2777;stroke-width:1.4;stroke-dasharray:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:.9rem 1rem;align-self:start}
.panel h2{font-size:1.25rem;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.panel h2 .tot{font-size:.85rem;background:var(--social-soft);color:var(--social);border-radius:99px;padding:.1em .7em;font-weight:800;white-space:nowrap}
.cats{list-style:none;padding:0;margin:.6rem 0 0;display:grid;gap:.35rem}
.cats li{display:grid;grid-template-columns:1.8rem 1fr auto;gap:.4rem;align-items:start;padding:.3rem .45rem;border-radius:12px;background:#f6f2fd;color:var(--muted)}
.cats li.has{background:var(--social-soft);color:var(--ink)}
.cats .ic{font-size:1.3rem;line-height:1.3}
.cats b{font-size:.98rem;display:block;line-height:1.2}
.cats small{display:block;font-size:.78rem;line-height:1.25;margin-top:.1rem;color:var(--ink);font-weight:600}
.cats .cnt{font-weight:900;font-size:1rem;min-width:1.5rem;text-align:center;background:#fff;border-radius:99px;padding:.05em .45em}
.cats li.has .cnt{background:var(--social);color:#fff}
.opt{display:flex;align-items:center;gap:.5rem;font-size:.85rem;font-weight:700;color:var(--muted);margin-top:.7rem}
.opt input{width:1.2rem;height:1.2rem;accent-color:var(--social)}

.hidden{display:none!important}

/* Tauler de revelació */
.exp{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;margin-bottom:.8rem;padding:.7rem 1rem;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.meter{display:flex;gap:4px}
.meter span{padding:.25em .9em;border-radius:99px;background:#eee9f8;font-weight:800;font-size:.9rem;color:var(--muted)}
.meter span.on.baixa{background:#d1fae5;color:#065f46}
.meter span.on.mitjana{background:#fde68a;color:#78350f}
.meter span.on.alta{background:#fecdd3;color:#9f1239}
.exp .txt{font-weight:700}
.board{position:relative}
.bgrid{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,15%) minmax(0,1.35fr);align-items:start}
.lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.lines path{fill:none;stroke-linecap:round;transition:opacity .2s}
.lines path.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dash .7s ease forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.lines path.dim{opacity:.1}
.bclues,.bconc{display:grid;gap:.4rem;align-content:start;position:relative;z-index:1}
.bclues{grid-column:1}
.bconc{grid-column:3;gap:.5rem}
.bc{padding:.3rem .6rem;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:.88rem;font-weight:700;line-height:1.2;display:flex;gap:.45rem;align-items:center;min-height:2.1rem}
.bc.f{border-color:var(--social);background:var(--social-soft)}
.bc.m{border-style:dashed;color:var(--muted)}
.bc .e{font-size:1.1rem}
.bc small{margin-left:auto;font-weight:700;color:var(--muted);font-size:.7rem;white-space:nowrap}
.cc{padding:.55rem .8rem;border-radius:14px;background:#fff;border:2px solid var(--line);position:relative}
.cc .hd{font-size:.78rem;font-weight:800;color:var(--muted);display:flex;gap:.4rem;align-items:center;margin-bottom:.1rem}
.cc .hd em{font-style:normal;margin-left:auto;padding:.05em .6em;border-radius:99px;font-size:.72rem}
.cc p{font-weight:700;font-size:.98rem;line-height:1.25}
.cc.got{border-color:var(--cc);box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 22%,transparent)}
.cc.got .hd em{background:#d1fae5;color:#065f46}
.cc.miss{border-style:dashed;background:#faf8fe}
.cc.miss .hd em{background:#fde68a;color:#78350f}
.cc .chips{display:none;flex-wrap:wrap;gap:.25rem;margin-top:.35rem}
.cc .chips span{font-size:.72rem;background:#f1ecfb;border-radius:99px;padding:.1em .6em;font-weight:700}
.cc .chips span.f{background:var(--social-soft);color:var(--social)}
.cc:focus-visible{outline:4px solid var(--blue)}
.safe{margin-top:.8rem;font-weight:600;color:var(--muted)}

/* Reflexió 2 */
.risk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px;margin-top:1rem}
.rk{padding:1rem 1.1rem}
.rk .em{font-size:2rem}
.rk h3{font-size:1.15rem;font-weight:900;margin:.2rem 0}
.rk p{color:var(--muted);font-weight:600;font-size:.98rem}
.good{margin-top:1rem;padding:1rem 1.2rem;border-radius:var(--radius);background:#e8f7ef;border:1px solid #a7e1c3;font-weight:700;font-size:1.1rem}
.help{margin-top:.7rem;padding:.8rem 1.1rem;border-radius:16px;background:#eef2ff;border:1px solid #c7d2fe;font-weight:600}

/* Hàbits */
.habits{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1.2vw,16px);margin-top:1.2rem}
.habit{padding:1.1rem 1rem 1.2rem;position:relative;display:flex;flex-direction:column;gap:.4rem;border-top:8px solid var(--hc)}
.habit .num{position:absolute;right:.8rem;top:.6rem;font-weight:900;font-size:1.6rem;color:var(--line)}
.habit .em{font-size:clamp(2.2rem,3.4vw,3.2rem)}
.habit h3{font-size:clamp(1.1rem,1.6vw,1.45rem);font-weight:900;line-height:1.1}
.habit p{font-weight:600;font-size:clamp(.95rem,1.25vw,1.15rem);color:var(--ink)}
.commit-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(12px,2vw,28px);margin-top:1rem;align-items:start}
.cstep{padding:.9rem 1.1rem;font-size:1.15rem;font-weight:600;margin-bottom:.6rem}
.starter{font-size:clamp(1.4rem,2.8vw,2.4rem);font-weight:900;line-height:1.15;padding:1.2rem 1.4rem;border-radius:24px;background:var(--grad);color:#fff;text-shadow:0 2px 8px rgba(60,10,90,.4)}
.timer{padding:1rem;text-align:center}
.timer .t{font-size:clamp(2.6rem,6vw,4.8rem);font-weight:900;font-variant-numeric:tabular-nums;color:var(--brand);line-height:1}
.thanks{margin-top:1rem;font-size:1.2rem;font-weight:700}

/* ---------- Responsiu ---------- */
@media (min-width:560px){ .feed{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:900px){ .pbody{grid-template-columns:minmax(0,1fr) 19rem} .panel{position:sticky;top:0;max-height:calc(100vh - 11rem);overflow:auto} }
@media (min-width:1100px){ .feed{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:1000px){
  .habits{grid-template-columns:repeat(2,minmax(0,1fr))}
  .habits .habit:last-child{grid-column:1/-1}
  .commit-grid,.two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:899px){
  .bgrid{grid-template-columns:minmax(0,1fr)}
  .bclues{display:none}
  .bconc{grid-column:1}
  .lines{display:none}
  .cc .chips{display:flex}
}
@media (max-width:640px){
  .logo .name,.top .partchip{display:none}
  .top{gap:8px}
  .clock{font-size:.8rem}
  .lang button{padding:.2em .5em}
  .hctl{grid-template-columns:auto 1fr auto;gap:8px}
  .hctl .hval{grid-column:1/-1;order:-1;display:flex;align-items:baseline;justify-content:center;gap:.5rem;min-width:0}
  .hctl .hval small{display:inline;margin:0}
  .stepbtn{width:3rem;height:3rem}
  .mini-stats{grid-template-columns:repeat(2,1fr)}
  .barrow{grid-template-columns:1fr}
  .nav .mid .keys{display:none}
  .btn{padding:.6em 1.1em}
  .lifewrap{grid-template-columns:1fr}
  .rowlab{display:none}
  .lifegrid{gap:3px;grid-template-columns:repeat(10,1fr)}
  .cell{font-size:.8rem}
}
@media (max-height:800px) and (min-width:700px){
  .top{padding-top:.3rem;padding-bottom:.3rem}
  .nav{padding-top:.3rem;padding-bottom:.3rem}
  .btn{min-height:2.6rem;padding:.4em 1.3em;font-size:1rem}
  .tall-only{display:none}
  textarea.cls{min-height:4.5rem}
  .two{margin-top:.5rem}
  .slide{padding-top:12px;padding-bottom:14px}
  .slide h1{font-size:clamp(1.6rem,3vw,2.5rem)}
  .kicker{margin-bottom:.3rem}
  .hctl{padding:.4rem 1rem}
  .stepbtn{width:3rem;height:3rem}
  .rangewrap input{height:2rem}
  .stat{padding:.7rem .9rem}
  .sentence{margin-top:.5rem}
  .lifewrap{margin-top:.6rem}
  .legend{margin-top:.5rem}
  .track{height:2.2rem}
  .bars{gap:.5rem;margin-top:.7rem}
  .equiv{padding:.5rem .8rem}
  .callout{margin-top:.7rem}
  .stats{margin-top:.7rem}
}

/* ---------- Moviment reduït ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .lines path.draw{stroke-dasharray:none;stroke-dashoffset:0}
}

/* ---------- Impressió ---------- */
@page{size:A4;margin:16mm}
@media print{
  html,body{height:auto;background:#fff}
  #app{display:none!important}
  #printSheet{display:block;color:#000;font-family:"Segoe UI",Arial,sans-serif}
  #printSheet h1{font-size:24pt;margin:0 0 4mm;display:flex;align-items:center;gap:4mm}
  #printSheet h1 svg{width:14mm;height:14mm}
  #printSheet .sub{font-size:11pt;color:#444;margin-bottom:8mm}
  #printSheet ol{list-style:none;padding:0;margin:0;display:grid;gap:4mm}
  #printSheet li{display:flex;gap:4mm;align-items:flex-start;border:1.2pt solid #000;border-radius:3mm;padding:3.5mm 4mm;break-inside:avoid}
  #printSheet li .box{flex:0 0 6mm;height:6mm;border:1.5pt solid #000;border-radius:1.2mm;margin-top:1mm}
  #printSheet li b{font-size:13pt;display:block}
  #printSheet li span{font-size:11.5pt}
  #printSheet .commit{margin-top:9mm;font-size:13pt;font-weight:700}
  #printSheet .line{border-bottom:1pt solid #000;height:9mm}
  #printSheet .foot{margin-top:8mm;font-size:10pt;color:#444}
}

/* Fusiona les traduccions sobre el català: els textos de `over` substitueixen
   els de `base`; tota la resta (números, emojis, ids…) es hereta. Les llistes
   d'objectes es fusionen per posició; les de textos se substitueixen senceres. */
function mergeContent(base, over) {
  if (over === undefined) return base;
  const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
  if (Array.isArray(base) && Array.isArray(over)) {
    if (!over.some(isObj)) return over;
    return base.map((b, i) => mergeContent(b, over[i]));
  }
  if (isObj(base) && isObj(over)) {
    const out = {};
    Object.keys(base).forEach(k => { out[k] = mergeContent(base[k], over[k]); });
    Object.keys(over).forEach(k => { if (!(k in out)) out[k] = over[k]; });
    return out;
  }
  return over;
}

/* ---------- escenes SVG ---------- */
function sceneSVG(sc, uid) {
  let g = '';
  (sc.items || []).forEach(it => {
    const t = '<text x="' + it.x + '" y="' + it.y + '" font-size="' + it.s + '" text-anchor="middle" dominant-baseline="central">' + it.e + '</text>';
    if (it.clue) g += '<g class="sclue" data-clue="' + it.clue + '" role="button" tabindex="0" aria-pressed="false" aria-label="' + esc(it.label || D.ui.alt) + '"><circle class="hit" cx="' + it.x + '" cy="' + it.y + '" r="' + (it.s * .66) + '"/>' + t + '</g>';
    else g += t;
  });
  (sc.tags || []).forEach(tag => {
    const fs = tag.fs || 5, lines = tag.t, lh = fs * 1.18;
    const w = Math.min(98, Math.max.apply(null, lines.map(l => l.length)) * fs * .64 + 5), h = lines.length * lh + 3.2;
    const x = Math.max(w / 2 + 1, Math.min(100 - w / 2 - 1, tag.x)), y = tag.y;
    let txt = '';
    lines.forEach((l, i) => { txt += '<text x="' + x + '" y="' + (y - h / 2 + 1.6 + lh * (i + .5)) + '" font-size="' + fs + '" text-anchor="middle" dominant-baseline="central">' + esc(l) + '</text>'; });
    const rect = '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h + '" rx="2"/>';
    if (tag.clue) g += '<g class="sclue tg stag ' + (tag.cls || '') + '" data-clue="' + tag.clue + '" role="button" tabindex="0" aria-pressed="false" aria-label="' + esc((tag.label || D.ui.alt) + ': ' + lines.join(' ')) + '">' + rect + txt + '</g>';
    else g += '<g class="stag ' + (tag.cls || '') + '">' + rect + txt + '</g>';
  });
  return '<svg viewBox="0 0 100 62" preserveAspectRatio="xMidYMid meet" aria-hidden="false" role="group">' + g + '</svg>';
}

/* =====================================================================
   MUNTATGE
   ===================================================================== */
let SL = [];
const stage = $('#stage'), prog = $('#prog'), langSel = $('#langSel');

function slideDefs() {
  return [
    { id: 'title', part: 1, html: titleSlide },
    { id: 'calc', part: 1, hours: true, html: calcSlide },

  ].concat(D.profiles.map(p => ({ id: 'p-' + p.id, part: 2, profile: p, html: () => profileSlide(p) })))
   .concat([
    { id: 'reflect2', part: 2, html: reflect2Slide },

/* Construeix (o reconstrueix, en canviar d'idioma) pantalles, progrés i textos fixos */
function build() {
  SL = slideDefs();
  stage.innerHTML = ''; prog.innerHTML = '';
  SL.forEach(s => {
    const sec = document.createElement('section');
    sec.className = 'slide' + (s.profile ? ' nohints' : ''); sec.id = 's-' + s.id; sec.hidden = true;
    sec.innerHTML = s.html(); stage.appendChild(sec); s.el = sec; s.min = C.minutes[s.id] || 0;
  });
  SL.forEach((s, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'p' + s.part;
    b.setAttribute('aria-label', C.ui.progLabel + ' ' + (i + 1));
    b.addEventListener('click', () => go(i));
    prog.appendChild(b);
  });
  document.documentElement.lang = lang;
  document.title = C.meta.title;
  $('#metaDesc').setAttribute('content', C.meta.description);
  prog.setAttribute('aria-label', C.meta.progLabel);
  langSel.setAttribute('aria-label', C.meta.langLabel);
  $$('button', langSel).forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('#brandName').textContent = C.brand.name;
  $('#keysHint').textContent = C.ui.keys;
  buildPrintSheet();
}

/* Torna a pintar l'estat (hores, pistes marcades, text de la classe…) sobre les pantalles noves */
function restoreState(clsText) {
  $('#clsIn').value = clsText; renderClass();
  $('#phrase').textContent = state.phrase;
  D.profiles.forEach(P => {
    const st = state.profiles[P.id], root = $('#s-p-' + P.id);
    st.found.forEach(id => $$('[data-clue="' + id + '"]', root).forEach(el => { el.classList.add('on'); el.setAttribute('aria-pressed', 'true'); }));
    updatePanel(P);
    if (st.revealed) setReveal(P, true);
  });
  if (state.hints) {
    $$('.play').forEach(p => p.classList.add('hints'));
    $$('.slide').forEach(s => s.classList.remove('nohints'));
    $$('[data-hints]').forEach(c => { c.checked = true; });
  }
  renderHours();
  $('#timerBtn').textContent = timerId ? C.commit.timerStop : C.commit.timerStart;
  timerShow();
}

function setLang(code) {
  if (!CONTENTS[code] || code === lang) return;
  const prevPhrase = C.reflect1.phrase, clsText = $('#clsIn').value;
  useLang(code);
  if (state.phrase === prevPhrase) state.phrase = C.reflect1.phrase;   /* si no l'han editat, passa a l'idioma nou */
  build(); restoreState(clsText);
  go(state.idx, { keep: true });
}

function go(i, opts) {
  const keep = !!(opts && opts.keep);   /* canvi d'idioma: mateixa pantalla, sense animació ni salt de focus */
  i = Math.max(0, Math.min(SL.length - 1, i));
  SL.forEach((s, k) => { s.el.hidden = (k !== i); s.el.classList.remove('enter'); });
  const s = SL[i]; state.idx = i;
  if (!keep && !reduceMQ.matches) { void s.el.offsetWidth; s.el.classList.add('enter'); }
  if (!keep) s.el.scrollTop = 0;
  $('#partChip').textContent = C.parts[s.part];
  $('#clock').innerHTML = esc(C.ui.minute) + ' ≈ <b>' + s.min + '</b> ' + esc(C.ui.of) + ' ' + C.totalMinutes;
  $('#screenNo').textContent = C.ui.screen + ' ' + (i + 1) + ' / ' + SL.length;
  $$('button', prog).forEach((b, k) => { b.classList.toggle('done', k < i); b.classList.toggle('cur', k === i); });
  $('#btnPrev').textContent = C.ui.prev; $('#btnNext').textContent = (i === SL.length - 1) ? C.ui.end : C.ui.next;
  $('#btnPrev').disabled = (i === 0); $('#btnNext').disabled = (i === SL.length - 1);
  try { history.replaceState(null, '', '#' + (i + 1) + (lang !== 'ca' ? '&lang=' + lang : '')); } catch (e) { /* file:// restringit en alguns navegadors */ }
  if (s.hours) { if (!keep) $$('[data-num]', s.el).forEach(el => { el._cur = 0; }); renderHours(); }
  if (s.profile && state.profiles[s.profile.id].revealed) requestAnimationFrame(() => drawLines(s.profile));
  const h = $('h1', s.el); if (h && !keep) h.focus({ preventScroll: true });
  if (document.activeElement && document.activeElement.type === 'range') document.activeElement.blur();
}

/* =====================================================================
   HORES
   ===================================================================== */
function setHours(v) {
  v = Math.round(v / T.step) * T.step;
  state.hours = Math.max(T.min, Math.min(T.max, v));
  renderHours();
}
function renderHours() {
  const h = state.hours, d = derive(h), pct = (h - T.min) / (T.max - T.min) * 100;
  $$('.hctl').forEach(c => {
    const inp = $('input', c);
    inp.value = h; inp.style.setProperty('--p', pct + '%');
    inp.setAttribute('aria-valuetext', fmt(h, 1) + ' ' + C.calc.perDay);
    $('.hv', c).textContent = fmt(h, 1);
  });
  $$('[data-num]').forEach(el => { if (el.dataset.num in d) setNum(el, d[el.dataset.num], +el.dataset.dec || 0); });
  $('#awakeLine').innerHTML = rich(fill(C.calc.awake, { pct: fmt(d.awake, 0) }));
  renderLife(d); renderCompare(d); renderRefSummary(d);
}
function renderLife(d) {
  const age = state.age, span = T.endAge - age, S = d.life, h = state.hours;
  $$('#lifeGrid .cell').forEach(cell => {
    const a = +cell.dataset.age;
    if (a < age) { cell.classList.add('lived'); cell.classList.remove('now', 'pk'); cell.style.setProperty('--f', 0); return; }
    cell.classList.remove('lived');
    const f = state.lifeMode === 'junt' ? Math.max(0, Math.min(1, S - (a - age))) : h / 24;
    cell.style.setProperty('--f', f.toFixed(3));
    cell.classList.toggle('now', a === age);
    cell.classList.toggle('pk', f >= .5);
  });
  $('#ageVal').innerHTML = '<b>' + age + '</b> ' + esc(C.life.ageUnit);
  $('#lifeUnit').textContent = fill(C.calc.life, { start: age, end: T.endAge });
  $('#lifeSentence').innerHTML = rich(fill(C.life.sentence, { h: fmt(h, 1), start: age, end: T.endAge, years: fmt(S, 1), pct: fmt(S / span * 100, 1) }));
}
const barMax = Math.max(T.max * 365, T.classHoursPerYear, T.sleepHoursPerYear, T.extraHoursPerWeek * T.extraWeeks);
function renderCompare(d) {
  const vals = { social: d.year, cls: T.classHoursPerYear, sleep: T.sleepHoursPerYear, extra: T.extraHoursPerWeek * T.extraWeeks };
  $$('[data-bar]').forEach(f => {
    const v = vals[f.dataset.bar], w = v / barMax * 100, bv = $('.bv', f);
    f.style.width = w.toFixed(2) + '%';
    f.style.minWidth = '0';
    bv.textContent = fmt(v, 0) + ' h';
    /* si la barra és massa estreta, el valor surt a fora */
    if (w < 14) { bv.style.cssText = 'position:absolute;left:calc(100% + .5rem);color:var(--ink);padding:0'; f.style.position = 'relative'; f.style.overflow = 'visible'; }
    else { bv.style.cssText = ''; f.style.overflow = ''; }
  });
  $('#cmpKey').innerHTML = rich(fill(C.compare.key, { pct: fmt(d.classPct, 0) }));
}
function renderRefSummary(d) {
  $('#refSum').innerHTML = rich(fill(C.reflect1.summary, { h: fmt(state.hours, 1), days: fmt(d.days, 1) }));
}

/* =====================================================================
   MODE CLASSE
   ===================================================================== */
function parseHours(txt) {
  const multi = /[;\n]/.test(txt);
  const parts = multi ? txt.split(/[;\s]+/) : txt.split(/[,\s]+/);
  const nums = []; let bad = 0;
  parts.forEach(p => {
    p = p.trim().replace(/h$/i, '');
    if (multi) p = p.replace(/,+$/, '').replace(',', '.');
    if (!p) return;
    const v = Number(p);
    if (!isFinite(v) || v < 0 || v > 24) bad++; else nums.push(v);
  });
  return { nums, bad };
}
function renderClass() {
  const m = C.classMode, r = parseHours($('#clsIn').value), n = r.nums.length;
  state.cls = r.nums;
  $('#clsWarn').textContent = r.bad ? fill(m.ignored, { n: r.bad }) : '';
  $('#clsEmpty').classList.toggle('hidden', n > 0);
  const bars = $$('#hist .hbar'), counts = new Array(8).fill(0);
  r.nums.forEach(v => { counts[Math.min(7, Math.floor(v))]++; });
  const mx = Math.max.apply(null, counts.concat([1]));
  bars.forEach((b, i) => { $('.b', b).style.height = (counts[i] / mx * 88).toFixed(1) + '%'; $('.c', b).textContent = counts[i] || ''; });
  if (!n) { ['stN', 'stAvg', 'stMax', 'stMin'].forEach(id => { $('#' + id).textContent = '–'; }); $('#clsYear').innerHTML = ''; return; }
  const avg = r.nums.reduce((a, b) => a + b, 0) / n;
  $('#stN').textContent = n; $('#stAvg').textContent = fmt(avg, 1);
  $('#stMax').textContent = fmt(Math.max.apply(null, r.nums), 1); $('#stMin').textContent = fmt(Math.min.apply(null, r.nums), 1);
  $('#clsYear').innerHTML = rich(fill(m.avgYear, { y: fmt(avg * 365, 0) }));
}

/* =====================================================================
   DETECTIUS
   ===================================================================== */
function updatePanel(P) {
  const st = state.profiles[P.id], root = $('#s-p-' + P.id);
  const cats = D.categories.map(cat => {
    const ids = Object.keys(P.clues).filter(id => st.found.has(id) && P.clues[id].cat === cat.key);
    return '<li class="' + (ids.length ? 'has' : '') + '"><span class="ic" aria-hidden="true">' + cat.icon + '</span><div><b>' + esc(cat.label) + '</b>' +
      (ids.length ? '<small>' + ids.map(id => esc(P.clues[id].label)).join(' · ') + '</small>' : '') + '</div><span class="cnt">' + ids.length + '</span></li>';
  }).join('');
  $('[data-cats]', root).innerHTML = cats;
  $('[data-tot]', root).textContent = fill(D.ui.total, { n: st.found.size });
}
function toggleClue(P, id) {
  const st = state.profiles[P.id], root = $('#s-p-' + P.id);
  if (!(id in P.clues)) return;
  if (st.found.has(id)) st.found.delete(id); else st.found.add(id);
  const on = st.found.has(id);
  $$('[data-clue="' + id + '"]', root).forEach(el => { el.classList.toggle('on', on); el.setAttribute('aria-pressed', on); });
  updatePanel(P);
}
function unlocked(P, found) {
  return P.conclusions.map(c => {
    const n = c.clues.filter(id => found.has(id)).length;
    return n >= (c.needs || 1) && (c.must || []).every(id => found.has(id));
  });
}
const LINECOL = ['#7c3aed', '#e0156f', '#0284c7', '#d97706', '#059669', '#c026d3', '#dc2626'];
function buildBoard(P) {
  const st = state.profiles[P.id], u = D.ui, un = unlocked(P, st.found), cnt = un.filter(Boolean).length, tot = P.conclusions.length;
  const ratio = cnt / tot, level = ratio <= .34 ? 'baixa' : ratio <= .67 ? 'mitjana' : 'alta';
  /* ordre de les pistes: segons la primera deducció on apareixen */
  const order = []; P.conclusions.forEach(c => c.clues.forEach(id => { if (order.indexOf(id) < 0) order.push(id); }));
  Object.keys(P.clues).forEach(id => { if (order.indexOf(id) < 0) order.push(id); });
  const used = {}; P.conclusions.forEach(c => c.clues.forEach(id => { used[id] = true; }));
  const meter = ['baixa', 'mitjana', 'alta'].map(l => '<span class="' + l + (l === level ? ' on' : '') + '">' + esc(u.levels[l]) + '</span>').join('');
  const cl = order.map(id => {
    const c = P.clues[id], f = st.found.has(id);
    return '<div class="bc ' + (f ? 'f' : 'm') + '" data-bc="' + id + '"><span class="e" aria-hidden="true">' + c.emoji + '</span><span>' + esc(c.label) + '</span>' + (used[id] ? '' : '<small>' + esc(u.harmless) + '</small>') + '</div>';
  }).join('');
  const cc = P.conclusions.map((c, i) => {
    const cat = D.categories.filter(k => k.key === c.cat)[0];
    const chips = c.clues.map(id => '<span class="' + (st.found.has(id) ? 'f' : '') + '">' + esc(P.clues[id].label) + '</span>').join('');
    return '<div class="cc ' + (un[i] ? 'got' : 'miss') + '" data-cc="' + i + '" tabindex="0" style="--cc:' + LINECOL[i % LINECOL.length] + '"><div class="hd"><span aria-hidden="true">' + cat.icon + '</span>' + esc(cat.label) +
      '<em>' + esc(un[i] ? u.got : u.miss) + '</em></div><p>' + esc(c.text) + '</p><div class="chips">' + chips + '</div></div>';
  }).join('');
  $('[data-board]', $('#s-p-' + P.id)).innerHTML =
    '<div class="exp"><strong>' + esc(u.exposure) + ':</strong><div class="meter" role="img" aria-label="' + esc(u.levels[level]) + '">' + meter + '</div>' +
    '<span class="txt">' + esc(fill(u.summary, { f: st.found.size, t: Object.keys(P.clues).length, c: cnt, k: tot })) + '</span></div>' +
    '<div class="bgrid" data-bgrid><svg class="lines" aria-hidden="true"></svg><div class="bclues" aria-label="' + esc(u.cluesTitle) + '">' + cl + '</div><div class="bconc" aria-label="' + esc(u.conclTitle) + '">' + cc + '</div></div>' +
    '<p class="safe">' + rich(u.allOpen) + ' ' + esc(u.safe) + '</p>';
}
function drawLines(P) {
  const root = $('#s-p-' + P.id), grid = $('[data-bgrid]', root);
  if (!grid || root.hidden) return;
  const svg = $('.lines', grid), st = state.profiles[P.id];
  if (getComputedStyle(svg).display === 'none') return;
  const gr = grid.getBoundingClientRect();
  svg.setAttribute('width', gr.width); svg.setAttribute('height', gr.height);
  const paths = []; let k = 0;
  P.conclusions.forEach((c, i) => {
    const cEl = $('[data-cc="' + i + '"]', grid), cr = cEl.getBoundingClientRect(), x2 = cr.left - gr.left, y2 = cr.top - gr.top + cr.height / 2;
    c.clues.forEach(id => {
      const bEl = $('[data-bc="' + id + '"]', grid); if (!bEl) return;
      const br = bEl.getBoundingClientRect(), x1 = br.right - gr.left, y1 = br.top - gr.top + br.height / 2, dx = (x2 - x1) * .55;
      const found = st.found.has(id);
      paths.push('<path data-c="' + i + '" class="' + (found && !reduceMQ.matches ? 'draw' : '') + '" pathLength="1" d="M' + x1 + ' ' + y1 + ' C' + (x1 + dx) + ' ' + y1 + ',' + (x2 - dx) + ' ' + y2 + ',' + x2 + ' ' + y2 +
        '" stroke="' + LINECOL[i % LINECOL.length] + '" stroke-width="' + (found ? 3 : 2) + '"' + (found ? '' : ' stroke-dasharray="0.02 0.02" opacity=".55"') + (found && !reduceMQ.matches ? ' style="animation-delay:' + (k * 70) + 'ms"' : '') + '/>');
      k++;
    });
  });
  svg.innerHTML = paths.join('');
}
function focusConclusion(root, i) {
  $$('.lines path', root).forEach(p => p.classList.toggle('dim', i !== null && p.dataset.c !== String(i)));
}
function setReveal(P, on) {
  const st = state.profiles[P.id], root = $('#s-p-' + P.id);
  st.revealed = on;
  $('.play', root).classList.toggle('hidden', on);
  $('[data-board]', root).classList.toggle('hidden', !on);
  const btn = $('[data-act="reveal"]', root);
  btn.textContent = on ? D.ui.back : D.ui.reveal;
  btn.classList.toggle('pink', !on);
  if (on) { buildBoard(P); requestAnimationFrame(() => drawLines(P)); }
  root.scrollTop = 0;
}

/* =====================================================================
   TEMPORITZADOR (compromís)
   ===================================================================== */
let timerLeft = 60, timerId = null;
function timerShow() { $('#timerT').textContent = timerLeft > 0 ? Math.floor(timerLeft / 60) + ':' + String(timerLeft % 60).padStart(2, '0') : C.commit.timerDone; }
function timerToggle() {
  const b = $('#timerBtn');
  if (timerId) { clearInterval(timerId); timerId = null; b.textContent = C.commit.timerStart; return; }
  if (timerLeft <= 0) timerLeft = 60;
  b.textContent = C.commit.timerStop;
  /* el botó es torna a buscar a cada tic: en canviar d'idioma les pantalles es reconstrueixen */
  timerId = setInterval(() => { timerLeft--; timerShow(); if (timerLeft <= 0) { clearInterval(timerId); timerId = null; $('#timerBtn').textContent = C.commit.timerStart; } }, 1000);
  timerShow();
}
function timerReset() { clearInterval(timerId); timerId = null; timerLeft = 60; $('#timerBtn').textContent = C.commit.timerStart; timerShow(); }

/* =====================================================================
   EVENTS
   ===================================================================== */
$('#btnPrev').addEventListener('click', () => go(state.idx - 1));
$('#btnNext').addEventListener('click', () => go(state.idx + 1));

stage.addEventListener('click', e => {
  const t = e.target;
  const step = t.closest('.stepbtn');
  if (step) { setHours(state.hours + (+step.dataset.step) * T.step); return; }
  const ageBtn = t.closest('[data-age-step]');
  if (ageBtn) { state.age = Math.max(T.ageMin, Math.min(T.ageMax, state.age + (+ageBtn.dataset.ageStep))); renderHours(); return; }
  const mode = t.closest('[data-mode]');
  if (mode) { state.lifeMode = mode.dataset.mode; $$('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b === mode)); renderHours(); return; }
  const act = t.closest('[data-act]');
  const slide = t.closest('.slide'), S = SL.filter(s => s.el === slide)[0];
  if (act) {
    switch (act.dataset.act) {
      case 'next': go(state.idx + 1); break;
      case 'example': $('#clsIn').value = C.classMode.exampleData; renderClass(); break;
      case 'clear': $('#clsIn').value = ''; renderClass(); $('#clsIn').focus(); break;
      case 'useavg': if (state.cls.length) { setHours(state.cls.reduce((a, b) => a + b, 0) / state.cls.length); } break;
      case 'resetphrase': state.phrase = C.reflect1.phrase; $('#phrase').textContent = state.phrase; break;
      case 'reveal': if (S && S.profile) setReveal(S.profile, !state.profiles[S.profile.id].revealed); break;
      case 'resetclues':
        if (S && S.profile) { const P = S.profile; state.profiles[P.id].found.clear(); $$('[data-clue]', slide).forEach(el => { el.classList.remove('on'); el.setAttribute('aria-pressed', 'false'); }); updatePanel(P); }
        break;
      case 'timer': timerToggle(); break;
      case 'timerreset': timerReset(); break;
      case 'print': window.print(); break;
    }
    return;
  }
  const clue = t.closest('[data-clue]');
  if (clue && S && S.profile) toggleClue(S.profile, clue.dataset.clue);
});

stage.addEventListener('input', e => {
  if (e.target.matches('.rangewrap input')) setHours(+e.target.value);
  else if (e.target.id === 'clsIn') renderClass();
  else if (e.target.id === 'phrase') state.phrase = e.target.textContent;
});
stage.addEventListener('change', e => {
  if (e.target.matches('[data-hints]')) {
    state.hints = e.target.checked;
    $$('.play').forEach(p => p.classList.toggle('hints', state.hints));
    $$('.slide').forEach(s => s.classList.toggle('nohints', !state.hints));
    $$('[data-hints]').forEach(c => { c.checked = state.hints; });
  }
});
/* deixa anar el control i torna el focus perquè les fletxes naveguin */
stage.addEventListener('pointerup', e => { if (e.target.matches('.rangewrap input')) setTimeout(() => e.target.blur(), 0); });

/* hover / focus sobre les deduccions */
stage.addEventListener('mouseover', e => { const c = e.target.closest('.cc'); if (c) focusConclusion(c.closest('.slide'), +c.dataset.cc); });
stage.addEventListener('mouseout', e => { const c = e.target.closest('.cc'); if (c) focusConclusion(c.closest('.slide'), null); });
stage.addEventListener('focusin', e => { const c = e.target.closest('.cc'); if (c) focusConclusion(c.closest('.slide'), +c.dataset.cc); });
stage.addEventListener('focusout', e => { const c = e.target.closest('.cc'); if (c) focusConclusion(c.closest('.slide'), null); });

window.addEventListener('resize', () => { const s = SL[state.idx]; if (s.profile && state.profiles[s.profile.id].revealed) drawLines(s.profile); });
window.addEventListener('hashchange', () => {
  const h = readHash();
  if (h.lang !== lang) setLang(h.lang);
  if (h.n && h.n - 1 !== state.idx) go(h.n - 1);
});

document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const t = e.target;
  if (t.matches('textarea,[contenteditable="true"],input[type="text"]')) { if (e.key === 'Escape') t.blur(); return; }
  /* Enter / espai sobre una pista d'una imatge (SVG) */
  if (t.classList && t.classList.contains('sclue') && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault(); const S = SL[state.idx]; if (S.profile) toggleClue(S.profile, t.dataset.clue); return;
  }
  const isRange = t.matches && t.matches('input[type="range"]');
  const hours = !!SL[state.idx].hours;
  switch (e.key) {
    case 'ArrowRight': case 'PageDown': e.preventDefault(); go(state.idx + 1); break;
    case 'ArrowLeft': case 'PageUp': e.preventDefault(); go(state.idx - 1); break;
    case 'ArrowUp': if (hours) { e.preventDefault(); setHours(state.hours + T.step); } break;
    case 'ArrowDown': if (hours) { e.preventDefault(); setHours(state.hours - T.step); } break;
    case 'Home': if (!isRange) { e.preventDefault(); go(0); } break;
    case 'End': if (!isRange) { e.preventDefault(); go(SL.length - 1); } break;
  }
});

/* inici */
LANGS.forEach(l => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = l.label; b.dataset.lang = l.code; b.lang = l.code;
  b.title = l.name; b.setAttribute('aria-label', l.name);
  b.addEventListener('click', () => setLang(l.code));
  langSel.appendChild(b);
});
build();
restoreState('');
const startN = readHash().n;
go(startN >= 1 && startN <= SL.length ? startN - 1 : 0);
})();
</script>

/* ====================================================================
   TEOREMES DEL SINUS I DEL COSINUS (batxillerat)
   ==================================================================== */
function triData(V){
  const d=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
  const a=d(V.B,V.C),b=d(V.C,V.A),c=d(V.A,V.B);
  const ang=(x,y,z)=>deg(Math.acos(clamp((y*y+z*z-x*x)/(2*y*z),-1,1)));
  return {a,b,c,A:ang(a,b,c),B:ang(b,a,c),C:ang(c,a,b)};
}
function triBoard(host,V,redraw,big){
  const B=new Board(host,big?{x0:-2,x1:18,y0:-3.5,y1:13.5}:{x0:0,x1:16,y0:0,y1:10});
  const mk=(k,col)=>B.handle(V[k][0],V[k][1],col,p=>{V[k]=[clamp(p.x,.4,15.6),clamp(p.y,.4,9.6)];redraw();});
  B.hs={A:mk('A','#1f2933'),B:mk('B','#1f2933'),C:mk('C','#1f2933')};
  B.sync=()=>{['A','B','C'].forEach(k=>B.hs[k].set(V[k][0],V[k][1]));};
  return B;
}
function drawAngles(B,V,T,hot){
  const names=['A','B','C'],others={A:['B','C'],B:['C','A'],C:['A','B']};
  names.forEach(n=>{
    const p=V[n],q=V[others[n][0]],r=V[others[n][1]];
    const t1=Math.atan2(q[1]-p[1],q[0]-p[0]),t2=Math.atan2(r[1]-p[1],r[0]-p[0]);
    let dd=t2-t1;dd=Math.atan2(Math.sin(dd),Math.cos(dd));
    const s=dd>0?t1:t2,e=s+Math.abs(dd),mid=s+Math.abs(dd)/2,isHot=hot===n;
    B.arc(p[0],p[1],isHot?1.1:.8,s,e,{stroke:isHot?'#ee8a22':'#7b4bb7','stroke-width':isHot?4.5:3});
    B.text(p[0]+1.75*Math.cos(mid),p[1]+1.75*Math.sin(mid)-.15,n+' = '+fmt(T[n],1)+'°',{class:'m','font-size':16,fill:isHot?'#b35f00':'#5a3590'});
  });
}
function sideLabel(B,V,k,txt,col){
  const [p,q]=k==='a'?[V.B,V.C]:k==='b'?[V.C,V.A]:[V.A,V.B];
  const m=[(p[0]+q[0])/2,(p[1]+q[1])/2],cen=[(V.A[0]+V.B[0]+V.C[0])/3,(V.A[1]+V.B[1]+V.C[1])/3];
  let nx=m[0]-cen[0],ny=m[1]-cen[1];const L=Math.hypot(nx,ny)||1;nx/=L;ny/=L;
  B.text(m[0]+nx*.75,m[1]+ny*.75-.12,txt,{class:'m','font-size':17,fill:col||'#1f2933'});
}

function sinTeo(host){
  const V={A:[2,1.6],B:[13.5,2.4],C:[6.5,8.4]},st={circ:true};
  const P=view(host,
    '<b>Teorema del sinus.</b> En qualsevol triangle, cada costat dividit pel sinus de l\'angle oposat dóna el mateix valor: <span class="fml"><b>a / sin A = b / sin B = c / sin C = 2R</b></span>, on R és el radi de la circumferència circumscrita.',
    `<div class="eq" data-r="eq"></div><hr>
     <label class="chk"><input type="checkbox" data-c="circ" checked> Mostra la circumferència circumscrita</label>
     <p class="note">Arrossega els vèrtexs A, B i C. Fixa't que les tres raons canvien alhora però sempre són iguals entre elles.</p>`);
  const B=triBoard(P.stage,V,draw);
  $('[data-c="circ"]',host).onchange=e=>{st.circ=e.target.checked;draw();};
  function draw(){
    const T=triData(V),{A,B:Bv,C}=V;
    B.clear();B.grid(1,{stroke:'#efece3'});
    if(st.circ){
      const d=2*(A[0]*(Bv[1]-C[1])+Bv[0]*(C[1]-A[1])+C[0]*(A[1]-Bv[1]));
      if(Math.abs(d)>1e-6){
        const f=p=>p[0]*p[0]+p[1]*p[1];
        const ux=(f(A)*(Bv[1]-C[1])+f(Bv)*(C[1]-A[1])+f(C)*(A[1]-Bv[1]))/d,uy=(f(A)*(C[0]-Bv[0])+f(Bv)*(A[0]-C[0])+f(C)*(Bv[0]-A[0]))/d;
        B.circ(ux,uy,Math.hypot(ux-A[0],uy-A[1]),{stroke:'#ee8a22','stroke-dasharray':'8 6','stroke-width':2.5});
        B.dot(ux,uy,4,{fill:'#ee8a22'});
      }
    }
    B.poly([A,Bv,C],{fill:'rgba(123,75,183,.12)',stroke:'#1f2933','stroke-width':3});
    drawAngles(B,V,T);
    sideLabel(B,V,'a','a = '+fmt(T.a,1),'#a82339');sideLabel(B,V,'b','b = '+fmt(T.b,1),'#17612e');sideLabel(B,V,'c','c = '+fmt(T.c,1),'#1c5ea8');
    B.sync();
    const rr=(x,s,ang)=>fmt(x,1)+' / sin '+fmt(ang,1)+'° = <b>'+fmt(x/sinD(ang),3)+'</b>';
    $('[data-r="eq"]',host).innerHTML='<span class="res"><span class="cc">a / sin A</span> = '+rr(T.a,0,T.A)+'<br><span class="cb">b / sin B</span> = '+rr(T.b,0,T.B)+'<br><span class="ca">c / sin C</span> = '+rr(T.c,0,T.C)+
      (st.circ?'<br><span class="co">2R</span> = <b>'+fmt(T.a/sinD(T.A),3)+'</b>':'')+'</span>';
  }
  draw();
}

function cosTeo(host){
  const V={A:[4.5,3.6],B:[11.5,3.9],C:[8,8.2]},st={x:'A',sq:true};
  const P=view(host,
    '<b>Teorema del cosinus.</b> Generalitza Pitàgores a qualsevol triangle: <span class="fml"><b>a² = b² + c² − 2·b·c·cos A</b></span> (i igual amb els altres costats). Si A = 90°, cos A = 0 i queda <b>a² = b² + c²</b>.',
    `<div class="row"><span>Costat que busquem:</span><span class="seg" data-seg="x"></span></div>
     <div class="eq" data-r="eq"></div><div data-r="cmp" style="margin:.3rem 0"></div><hr>
     <label class="chk"><input type="checkbox" data-c="sq" checked> Mostra els quadrats dels costats</label>
     <p class="note">Arrossega els vèrtexs. Posa A, B o C a 90° i el terme 2bc·cos A desapareix.</p>`);
  const B=triBoard(P.stage,V,draw,true);
  segment(host,'x',[['A','a (angle A)'],['B','b (angle B)'],['C','c (angle C)']],'A',v=>{st.x=v;draw();});
  $('[data-c="sq"]',host).onchange=e=>{st.sq=e.target.checked;draw();};
  const sqOn=(p,q)=>{
    const cen=[(V.A[0]+V.B[0]+V.C[0])/3,(V.A[1]+V.B[1]+V.C[1])/3];
    const dx=q[0]-p[0],dy=q[1]-p[1];let n=[-dy,dx];
    const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;
    if(n[0]*(cen[0]-mx)+n[1]*(cen[1]-my)>0)n=[-n[0],-n[1]];
    return [p,q,[q[0]+n[0],q[1]+n[1]],[p[0]+n[0],p[1]+n[1]]];
  };
  function draw(){
    const T=triData(V);
    B.clear();B.grid(1,{stroke:'#efece3'});
    const sides={a:[V.B,V.C],b:[V.C,V.A],c:[V.A,V.B]},col={a:'217,67,90',b:'47,168,79',c:'47,127,208'};
    const want=st.x==='A'?'a':st.x==='B'?'b':'c';
    if(st.sq)['a','b','c'].forEach(k=>{
      const q=sqOn(sides[k][0],sides[k][1]);
      B.poly(q,{fill:'rgba('+col[k]+','+(k===want?.35:.2)+')',stroke:'rgb('+col[k]+')','stroke-width':k===want?3:1.8});
      const m=[q.reduce((s,p)=>s+p[0],0)/4,q.reduce((s,p)=>s+p[1],0)/4];
      B.text(m[0],m[1]-.1,k+'² = '+fmt(T[k]*T[k],1),{class:'m res','font-size':15});
    });
    B.poly([V.A,V.B,V.C],{fill:'rgba(255,255,255,.8)',stroke:'#1f2933','stroke-width':3});
    drawAngles(B,V,T,st.x);
    sideLabel(B,V,'a','a = '+fmt(T.a,1),'#a82339');sideLabel(B,V,'b','b = '+fmt(T.b,1),'#17612e');sideLabel(B,V,'c','c = '+fmt(T.c,1),'#1c5ea8');
    B.sync();
    const o=want,[y,z]=['a','b','c'].filter(k=>k!==o),X=st.x;
    const s2=T[y]*T[y]+T[z]*T[z],term=2*T[y]*T[z]*cosD(T[X]),res=s2-term;
    $('[data-r="eq"]',host).innerHTML=
      o+'² = '+y+'² + '+z+'² − 2·'+y+'·'+z+'·cos '+X+'<br><span class="res">'+
      o+'² = '+fmt(T[y],1)+'² + '+fmt(T[z],1)+'² − 2·'+fmt(T[y],1)+'·'+fmt(T[z],1)+'·cos '+fmt(T[X],1)+'°<br>'+
      o+'² = '+fmt(T[y]*T[y],1)+' + '+fmt(T[z]*T[z],1)+' − ('+fmt(term,1)+') = <b>'+fmt(res,1)+'</b><br>'+
      o+' = √'+fmt(res,1)+' = <b>'+fmt(Math.sqrt(Math.max(res,0)),2)+'</b></span>';
    const ang=T[X];
    $('[data-r="cmp"]',host).innerHTML=Math.abs(ang-90)<1?'<span class="pill ok res">Angle recte: el terme −2yz·cos val ≈ 0 → Pitàgores</span>':
      '<span class="pill in res">'+(ang<90?'Angle agut: '+o+'² < '+y+'² + '+z+'²':'Angle obtús: '+o+'² > '+y+'² + '+z+'²')+'</span>';
  }
  draw();
}

function sincosPractica(host){
  const ang3=()=>{let A,B;do{A=rnd(35,85);B=rnd(30,80);}while(A+B>160);return [A,B,180-A-B];};
  practice(host,[
    {name:'Sinus: troba un costat',make(){
      const [A,B,C]=ang3(),a=rnd(6,20),b=a*sinD(B)/sinD(A);
      return {text:'Calcula el costat <b>b</b> (2 decimals). Figura no a escala.',fig:figGen('a = '+a,'b = ?','','A = '+A+'°','B = '+B+'°',''),fields:[{label:'b =',ans:b}],
        sol:'a / sin A = b / sin B → b = a · sin B / sin A<br>b = '+a+' · sin '+B+'° / sin '+A+'° = <b>'+fmt(b,2)+'</b>'};}},
    {name:'Sinus: troba un angle',make(){
      const A=rnd(55,89),B0=rnd(25,A-8),a=rnd(8,20),b=Math.round(a*sinD(B0)/sinD(A)*10)/10,B=deg(Math.asin(b*sinD(A)/a));
      return {text:'Calcula l\'angle <b>B</b> (agut, 1 decimal). Figura no a escala.',fig:figGen('a = '+a,'b = '+fmt(b,1),'','A = '+A+'°','B = ?',''),fields:[{label:'B =',unit:'°',ans:B,tol:.2}],
        sol:'a / sin A = b / sin B → sin B = b · sin A / a = '+fmt(b,1)+' · sin '+A+'° / '+a+' = '+fmt(b*sinD(A)/a,4)+'<br>B = sin<sup>−1</sup>('+fmt(b*sinD(A)/a,4)+') = <b>'+fmt(B,1)+'°</b>'};}},
    {name:'Cosinus: troba un costat',make(){
      const b=rnd(4,15),c=rnd(4,15),A=rnd(30,130),a=Math.sqrt(b*b+c*c-2*b*c*cosD(A));
      return {text:'Calcula el costat <b>a</b> (2 decimals). Figura no a escala.',fig:figGen('a = ?','b = '+b,'c = '+c,'A = '+A+'°','',''),fields:[{label:'a =',ans:a}],
        sol:'a² = b² + c² − 2bc·cos A = '+b+'² + '+c+'² − 2·'+b+'·'+c+'·cos '+A+'°<br>a² = '+(b*b+c*c)+' − ('+fmt(2*b*c*cosD(A),2)+') = '+fmt(a*a,2)+'<br>a = <b>'+fmt(a,2)+'</b>'};}},
    {name:'Cosinus: troba un angle',make(){
      let a,b,c;do{b=rnd(5,14);c=rnd(5,14);a=rnd(Math.abs(b-c)+2,b+c-2);}while(a<2);
      const cs=(b*b+c*c-a*a)/(2*b*c),A=deg(Math.acos(cs));
      return {text:'Calcula l\'angle <b>A</b> (1 decimal). Figura no a escala.',fig:figGen('a = '+a,'b = '+b,'c = '+c,'A = ?','',''),fields:[{label:'A =',unit:'°',ans:A,tol:.2}],
        sol:'a² = b² + c² − 2bc·cos A → cos A = (b² + c² − a²) / (2bc)<br>cos A = ('+b*b+' + '+c*c+' − '+a*a+') / (2·'+b+'·'+c+') = '+fmt(cs,4)+'<br>A = cos<sup>−1</sup>('+fmt(cs,4)+') = <b>'+fmt(A,1)+'°</b>'};}},
    {name:'Quin teorema fem servir?',make(){
      const cases=[
        ['Coneixem dos angles i un costat.',0,'Amb dos angles i un costat tenim una parella costat–angle oposat: teorema del <b>sinus</b>.'],
        ['Coneixem dos costats i l\'angle que formen.',1,'Falta la parella costat–angle oposat: cal el teorema del <b>cosinus</b>.'],
        ['Coneixem els tres costats i volem un angle.',1,'Sense cap angle conegut, només serveix el teorema del <b>cosinus</b>.'],
        ['Coneixem dos costats i l\'angle oposat a un d\'ells.',0,'Hi ha una parella costat–angle oposat: teorema del <b>sinus</b>.']];
      const c=pick(cases);
      return {text:'Per resoldre un triangle on '+c[0].charAt(0).toLowerCase()+c[0].slice(1)+' Quin teorema és més adequat?',options:['Teorema del sinus','Teorema del cosinus'],correct:c[1],sol:c[2]};}}
  ],'<b>Practica.</b> Recorda: el sinus necessita una parella costat–angle oposat; el cosinus serveix amb SAS o amb els 3 costats.');
}
addTab({id:'sc',title:'Sinus i cosinus',subs:[
  {id:'sin',title:'Teorema del sinus',build:sinTeo},
  {id:'cos',title:'Teorema del cosinus',build:cosTeo},
  {id:'pra',title:'Practica',build:sincosPractica}]});

boot();
})();
</script>

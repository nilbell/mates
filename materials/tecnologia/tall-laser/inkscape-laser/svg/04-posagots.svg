<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="100mm" height="100mm" viewBox="0 0 100 100" version="1.1">
  <title>Exercici 3: posagots</title>
  <desc>Posagots rodó de 90 mm amb motiu geomètric gravat (patró polar).</desc>
  <sodipodi:namedview id="namedview1" pagecolor="#ffffff" bordercolor="#666666"
     inkscape:document-units="mm" showgrid="false" />
  <!-- CAPA GRAVAT: farciment (color de gravat), sense traç. Es grava primer. -->
  <g inkscape:groupmode="layer" id="capa-gravat" inkscape:label="GRAVAT">
    <ellipse id="gravat-petal-0" cx="50" cy="35" rx="6" ry="13" transform="rotate(0 50 50)" style="fill:#ff0000;stroke:none" />
    <ellipse id="gravat-petal-1" cx="50" cy="35" rx="6" ry="13" transform="rotate(60 50 50)" style="fill:#ff0000;stroke:none" />
    <ellipse id="gravat-petal-2" cx="50" cy="35" rx="6" ry="13" transform="rotate(120 50 50)" style="fill:#ff0000;stroke:none" />
    <ellipse id="gravat-petal-3" cx="50" cy="35" rx="6" ry="13" transform="rotate(180 50 50)" style="fill:#ff0000;stroke:none" />
    <ellipse id="gravat-petal-4" cx="50" cy="35" rx="6" ry="13" transform="rotate(240 50 50)" style="fill:#ff0000;stroke:none" />
    <ellipse id="gravat-petal-5" cx="50" cy="35" rx="6" ry="13" transform="rotate(300 50 50)" style="fill:#ff0000;stroke:none" />
  </g>
  <!-- CAPA MARCAT: línia fina superficial (opcional). -->
  <g inkscape:groupmode="layer" id="capa-marcat" inkscape:label="MARCAT">
    <circle id="marcat-cercle" cx="50" cy="50" r="40" style="fill:none;stroke:#0000ff;stroke-width:0.1" />
    <circle id="marcat-centre" cx="50" cy="50" r="6" style="fill:none;stroke:#0000ff;stroke-width:0.1" />
  </g>
  <!-- CAPA TALL: només contorns (color de tall), sense farciment, 0.1 mm. Es talla l'últim. -->
  <g inkscape:groupmode="layer" id="capa-tall" inkscape:label="TALL">
    <circle id="tall-posagots" cx="50" cy="50" r="45" style="fill:none;stroke:#000000;stroke-width:0.1" />
  </g>
</svg>

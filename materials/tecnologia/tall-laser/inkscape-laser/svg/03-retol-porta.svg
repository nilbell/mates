<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="160mm" height="70mm" viewBox="0 0 160 70" version="1.1">
  <title>Exercici 2: rètol de porta</title>
  <desc>Rètol amb forats per penjar, marc marcat i text gravat.</desc>
  <sodipodi:namedview id="namedview1" pagecolor="#ffffff" bordercolor="#666666"
     inkscape:document-units="mm" showgrid="false" />
  <!-- CAPA GRAVAT: farciment (color de gravat), sense traç. Es grava primer. -->
  <g inkscape:groupmode="layer" id="capa-gravat" inkscape:label="GRAVAT">
    <text id="text-retol" x="80" y="47" style="font-family:sans-serif;font-weight:bold;font-size:18px;text-anchor:middle;fill:#ff0000;stroke:none">AULA 1.04</text>
  </g>
  <!-- CAPA MARCAT: línia fina superficial (opcional). -->
  <g inkscape:groupmode="layer" id="capa-marcat" inkscape:label="MARCAT">
    <rect id="marcat-marc" x="10" y="22" width="140" height="38" rx="5" ry="5" style="fill:none;stroke:#0000ff;stroke-width:0.1" />
  </g>
  <!-- CAPA TALL: només contorns (color de tall), sense farciment, 0.1 mm. Es talla l'últim. -->
  <g inkscape:groupmode="layer" id="capa-tall" inkscape:label="TALL">
    <rect id="tall-retol" x="5" y="5" width="150" height="60" rx="8" ry="8" style="fill:none;stroke:#000000;stroke-width:0.1" />
    <circle id="tall-forat-1" cx="15" cy="15" r="2.5" style="fill:none;stroke:#000000;stroke-width:0.1" />
    <circle id="tall-forat-2" cx="145" cy="15" r="2.5" style="fill:none;stroke:#000000;stroke-width:0.1" />
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="170mm" height="85mm" viewBox="0 0 170 85" version="1.1">
  <title>Mostra: tallar, gravar i marcar</title>
  <desc>Exemple de cada tipus d'operació. Fixa't en els colors i en farciment/traç.</desc>
  <sodipodi:namedview id="namedview1" pagecolor="#ffffff" bordercolor="#666666"
     inkscape:document-units="mm" showgrid="false" />
  <!-- CAPA GRAVAT: farciment (color de gravat), sense traç. Es grava primer. -->
  <g inkscape:groupmode="layer" id="capa-gravat" inkscape:label="GRAVAT">
    <polygon id="gravat-estrella" points="85.000,12.000 89.702,23.528 102.119,24.438 92.608,32.472 95.580,44.562 85.000,38.000 74.420,44.562 77.392,32.472 67.881,24.438 80.298,23.528" style="fill:#ff0000;stroke:none" />
    <text id="text-gravat" x="45" y="72" style="font-family:sans-serif;font-weight:bold;font-size:10px;text-anchor:middle;fill:#ff0000;stroke:none">Text gravat</text>
  </g>
  <!-- CAPA MARCAT: línia fina superficial (opcional). -->
  <g inkscape:groupmode="layer" id="capa-marcat" inkscape:label="MARCAT">
    <line id="marcat-linia-0" x1="120" y1="14" x2="160" y2="14" style="fill:none;stroke:#0000ff;stroke-width:0.1" />
    <line id="marcat-linia-1" x1="120" y1="22" x2="160" y2="22" style="fill:none;stroke:#0000ff;stroke-width:0.1" />
    <line id="marcat-linia-2" x1="120" y1="30" x2="160" y2="30" style="fill:none;stroke:#0000ff;stroke-width:0.1" />
    <line id="marcat-linia-3" x1="120" y1="38" x2="160" y2="38" style="fill:none;stroke:#0000ff;stroke-width:0.1" />
    <line id="marcat-linia-4" x1="120" y1="46" x2="160" y2="46" style="fill:none;stroke:#0000ff;stroke-width:0.1" />
  </g>
  <!-- CAPA TALL: només contorns (color de tall), sense farciment, 0.1 mm. Es talla l'últim. -->
  <g inkscape:groupmode="layer" id="capa-tall" inkscape:label="TALL">
    <rect id="tall-quadrat" x="10" y="10" width="40" height="40" rx="0" ry="0" style="fill:none;stroke:#000000;stroke-width:0.1" />
    <circle id="tall-forat" cx="30" cy="30" r="8" style="fill:none;stroke:#000000;stroke-width:0.1" />
    <text id="text-tallat" x="125" y="72" style="font-family:sans-serif;font-weight:bold;font-size:10px;text-anchor:middle;fill:none;stroke:#000000;stroke-width:0.1">Text tallat</text>
    <rect id="tall-contorn" x="5" y="5" width="160" height="75" rx="4" ry="4" style="fill:none;stroke:#000000;stroke-width:0.1" />
  </g>
</svg>

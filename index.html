<style>
  :root {
    --bg: #f6f7f9; --surf: #ffffff; --text: #1d2330; --muted: #5d6679; --line: #dde1e8;
    --accent: #2f5fd0; --accent-bg: #e6edfb; --accent-text: #ffffff;
    --propi: #1c7a4a; --propi-bg: #e0f3e8; --extern: #9a5b00; --extern-bg: #fbeed5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171f; --surf: #1d212c; --text: #e8ebf2; --muted: #9aa3b5; --line: #2f3545;
      --accent: #7ea2ff; --accent-bg: #26324f; --accent-text: #0f1420;
      --propi: #6fd39b; --propi-bg: #1d3a2b; --extern: #f0b95f; --extern-bg: #3d2f14;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171f; --surf: #1d212c; --text: #e8ebf2; --muted: #9aa3b5; --line: #2f3545;
    --accent: #7ea2ff; --accent-bg: #26324f; --accent-text: #0f1420;
    --propi: #6fd39b; --propi-bg: #1d3a2b; --extern: #f0b95f; --extern-bg: #3d2f14;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header, main { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 24px; }
  h1 { margin: 0; font-size: 1.6rem; display: flex; align-items: center; gap: 10px; }
  .logo { width: 36px; height: 36px; flex: none; }
  .sub { color: var(--muted); margin: 2px 0 16px; }
  .panell { background: var(--surf); border: 1px solid var(--line); border-radius: 12px;
            padding: 14px; display: grid; gap: 12px; }
  .fila { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .etiqueta { font-size: .8rem; font-weight: 600; color: var(--muted); min-width: 64px; }
  input[type=search], select { font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  input[type=search] { flex: 1 1 260px; }
  select { flex: 1 1 220px; max-width: 100%; }
  .xip { font: inherit; font-size: .9rem; color: var(--text); background: var(--bg);
         border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .xip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .xip small { opacity: .7; margin-left: 4px; }
  .neteja { font: inherit; font-size: .9rem; color: var(--accent); background: none; border: 0;
            cursor: pointer; text-decoration: underline; margin-left: auto; }
  .resum { margin: 16px 0 8px; color: var(--muted); font-size: .9rem; }
  .graella { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
             padding-bottom: 40px; }
  .targeta { background: var(--surf); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
             display: flex; flex-direction: column; gap: 8px; }
  .targeta h2 { margin: 0; font-size: 1.05rem; }
  .targeta p { margin: 0; color: var(--muted); font-size: .92rem; }
  .insignies { display: flex; flex-wrap: wrap; gap: 5px; }
  .ins { font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: var(--accent-bg); color: var(--accent); }
  .ins.propi { background: var(--propi-bg); color: var(--propi); }
  .ins.extern { background: var(--extern-bg); color: var(--extern); }
  .ins.neutra { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .ins.proposta { background: transparent; color: var(--muted); border: 1px dashed var(--muted); font-style: italic; }
  .miniatura { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #fff;
               border: 1px solid var(--line); border-radius: 8px; }
  .peu { margin-top: auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: .85rem; }
  .peu a { color: var(--accent); }
  .boto { background: var(--accent); color: var(--accent-text) !important; text-decoration: none;
          padding: 6px 14px; border-radius: 8px; font-weight: 600; }
  .font { color: var(--muted); font-size: .8rem; }
  .buit { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; }
</style>

t/probabilitat-grans-nombres/captura.png", "extres": [], "carpeta": "materials/matematiques/probabilitat/probabilitat-grans-nombres"}, {"id": "materials/tutoria/xarxes-socials/xarxes-socials-institut", "titol": "Instaxat: tutoria sobre xarxes socials", "descripcio": "Sessió de tutoria de 45 min per projectar: calcula el temps que dediquem a les xarxes i «detectius de privacitat» amb perfils fictius. Català, castellà i anglès.", "materia": "tutoria", "temes": ["xarxes-socials"], "nivells": ["2ESO"], "tipus": "activitat", "origen": "propi", "autor": "Nil Bellmunt Vilalta · Institut Ermengol IV", "urlFont": "", "llicencia": "", "etiquetes": ["tutoria", "privacitat", "pissarra digital"], "data": "2026-10-22", "obrir": "materials/tutoria/xarxes-socials/xarxes-socials-institut/index.html", "imatge": "materials/tutoria/xarxes-socials/xarxes-socials-institut/captura.png", "extres": [], "carpeta": "materials/tutoria/xarxes-socials/xarxes-socials-institut"}]};
const R = D.recursos;
// Els recursos propis s'obren en una pestanya nova, excepte a la pàgina publicada (prepara_artifact.py ho posa a false):
// allà una pestanya nova queda bloquejada i s'han d'obrir dins del mateix marc.
const NOVA_PESTANYA = true;
const destinacio = h => (NOVA_PESTANYA || /^https?:/.test(h)) ? ' target="_blank" rel="noopener"' : "";
const estat = { q: "", mat: "", tema: "", niv: [], tipus: "", origen: "" };

const temaInfo = {};
D.materies.forEach(m => m.blocs.forEach(b => b.temes.forEach(t => {
  temaInfo[t.id] = { nom: t.nom, bloc: b.nom, materia: m.id };
})));
const matNom = Object.fromEntries(D.materies.map(m => [m.id, m.nom]));
const ordreMat = Object.fromEntries(D.materies.map((m, i) => [m.id, i]));
const ordreTema = {}; Object.keys(temaInfo).forEach((id, i) => ordreTema[id] = i);

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

const textCerca = Object.fromEntries(R.map(r => [r.id, norm([
  r.titol, r.descripcio, r.autor, r.etiquetes.join(" "), r.temes.map(t => temaInfo[t].nom).join(" ")
].join(" "))]));

// `salta` permet comptar les facetes ignorant el filtre que s'està comptant
function coincideix(r, salta) {
  if (salta !== "q" && estat.q && !textCerca[r.id].includes(norm(estat.q))) return false;
  if (salta !== "mat" && estat.mat && r.materia !== estat.mat) return false;
  if (salta !== "tema" && estat.tema && !r.temes.includes(estat.tema)) return false;
  if (salta !== "niv" && estat.niv.length && !r.nivells.some(n => estat.niv.includes(n))) return false;
  if (salta !== "tipus" && estat.tipus && r.tipus !== estat.tipus) return false;
  if (salta !== "origen" && estat.origen && r.origen !== estat.origen) return false;
  return true;
}

function llegeixHash() {
  let text = location.hash.slice(1);
  // si l'adreça no porta filtres (pàgina publicada), recupera els de l'última visita en tornar d'un recurs
  if (!text) { try { text = sessionStorage.getItem("filtres") || ""; } catch (e) { /* sense emmagatzematge */ } }
  const p = new URLSearchParams(text);
  estat.q = p.get("q") || ""; estat.mat = p.get("mat") || ""; estat.tema = p.get("tema") || "";
  estat.niv = (p.get("niv") || "").split(",").filter(Boolean);
  estat.tipus = p.get("tipus") || ""; estat.origen = p.get("origen") || "";
}
function escriuHash() {
  const p = new URLSearchParams();
  Object.entries({ ...estat, niv: estat.niv.join(",") }).forEach(([k, v]) => v && p.set(k, v));
  try { sessionStorage.setItem("filtres", p.toString()); } catch (e) { /* sense emmagatzematge */ }
  try { history.replaceState(null, "", p.toString() ? "#" + p : location.pathname + location.search); }
  catch (e) { /* en un marc restringit (pàgina publicada) l'adreça no es pot canviar */ }
}

function pintaFiltres() {
  const xip = (text, n, premut, attr) =>
    `<button type="button" class="xip" aria-pressed="${premut}" ${attr}>${esc(text)}${n === null ? "" : `<small>${n}</small>`}</button>`;

  $("materies").innerHTML =
    xip("Totes", R.filter(r => coincideix(r, "mat")).length, !estat.mat, 'data-mat=""') +
    D.materies.map(m => xip(m.nom, R.filter(r => r.materia === m.id && coincideix(r, "mat")).length,
      estat.mat === m.id, `data-mat="${m.id}"`)).join("");

  $("nivells").innerHTML = D.nivells.map(n => xip(n, R.filter(r => r.nivells.includes(n) && coincideix(r, "niv")).length,
    estat.niv.includes(n), `data-niv="${n}"`)).join("");

  const compta = {}; R.filter(r => coincideix(r, "tema")).forEach(r => r.temes.forEach(t => compta[t] = (compta[t] || 0) + 1));
  const materies = D.materies.filter(m => !estat.mat || m.id === estat.mat);
  $("tema").innerHTML = `<option value="">Tots els temes</option>` + materies.map(m => m.blocs.map(b =>
    `<optgroup label="${esc(estat.mat ? b.nom : m.nom + " · " + b.nom)}">` + b.temes.map(t =>
      `<option value="${t.id}" ${compta[t.id] || estat.tema === t.id ? "" : "disabled"}>${esc(t.nom)} (${compta[t.id] || 0})</option>`
    ).join("") + `</optgroup>`).join("")).join("");
  $("tema").value = estat.tema;

  $("tipus").innerHTML = `<option value="">Qualsevol tipus</option>` + D.tipus.map(t =>
    `<option value="${esc(t)}">${esc(t)} (${R.filter(r => r.tipus === t && coincideix(r, "tipus")).length})</option>`).join("");
  $("tipus").value = estat.tipus;
  $("origen").value = estat.origen;
  if (document.activeElement !== $("q")) $("q").value = estat.q;
}

function pintaTargeta(r) {
  const temes = r.temes.map(t => `<span class="ins">${esc(temaInfo[t].nom)}</span>`).join("");
  const nivells = r.nivells.map(n => `<span class="ins neutra">${esc(n)}</span>`).join("");
  const href = /^https?:/.test(r.obrir) ? r.obrir : encodeURI(r.obrir);
  const font = [r.autor, r.llicencia].filter(Boolean).join(" · ");
  const extres = r.extres.map(e => { const h = /^https?:/.test(e.href) ? e.href : encodeURI(e.href);
    return `<a href="${esc(h)}"${destinacio(h)}>${esc(e.nom)}</a>`; }).join("");
  const etiq = r.etiquetes.includes("proposta") ? `<span class="ins proposta">proposta</span>` : "";
  return `<article class="targeta">
    ${r.imatge ? `<img class="miniatura" loading="lazy" src="${esc(encodeURI(r.imatge))}" alt="">` : ""}
    <div class="insignies"><span class="ins ${r.origen}">${r.origen === "propi" ? "Propi" : "Extern"}</span>${etiq}
      <span class="ins neutra">${esc(r.tipus)}</span>${nivells}</div>
    <h2>${esc(r.titol)}</h2>
    ${r.descripcio ? `<p>${esc(r.descripcio)}</p>` : ""}
    <div class="insignies">${temes}</div>
    ${font ? `<div class="font">${esc(font)}</div>` : ""}
    <div class="peu"><a class="boto" href="${esc(href)}"${destinacio(href)}>Obrir</a>
      ${r.carpeta ? `<a href="${esc(encodeURI(r.carpeta))}/"${destinacio("")}>Carpeta</a>` : ""}
      ${extres}
      ${r.urlFont && r.urlFont !== r.obrir ? `<a href="${esc(r.urlFont)}" target="_blank" rel="noopener">Font</a>` : ""}</div>
  </article>`;
}

function pinta() {
  pintaFiltres();
  const trobats = R.filter(r => coincideix(r)).sort((a, b) =>
    ordreMat[a.materia] - ordreMat[b.materia] || ordreTema[a.temes[0]] - ordreTema[b.temes[0]] ||
    D.nivells.indexOf(a.nivells[0]) - D.nivells.indexOf(b.nivells[0]) || a.titol.localeCompare(b.titol, "ca"));
  $("resum").textContent = `${trobats.length} de ${R.length} recursos`;
  $("graella").innerHTML = trobats.length ? trobats.map(pintaTargeta).join("") :
    `<div class="buit">${R.length ? "Cap recurs amb aquests filtres." :
      "Encara no hi ha cap recurs. Crea'n un amb eines/nou.py i executa actualitza.bat."}</div>`;
  escriuHash();
}

$("total").textContent = `${R.length} recursos`;
$("q").addEventListener("input", e => { estat.q = e.target.value; pinta(); });
$("tema").addEventListener("change", e => { estat.tema = e.target.value; pinta(); });
$("tipus").addEventListener("change", e => { estat.tipus = e.target.value; pinta(); });
$("origen").addEventListener("change", e => { estat.origen = e.target.value; pinta(); });
$("materies").addEventListener("click", e => {
  const b = e.target.closest("[data-mat]"); if (!b) return;
  estat.mat = b.dataset.mat;
  if (estat.tema && temaInfo[estat.tema].materia !== estat.mat && estat.mat) estat.tema = "";
  pinta();
});
$("nivells").addEventListener("click", e => {
  const b = e.target.closest("[data-niv]"); if (!b) return;
  const n = b.dataset.niv;
  estat.niv = estat.niv.includes(n) ? estat.niv.filter(x => x !== n) : [...estat.niv, n];
  pinta();
});
$("neteja").addEventListener("click", () => {
  Object.assign(estat, { q: "", mat: "", tema: "", niv: [], tipus: "", origen: "" }); pinta();
});
window.addEventListener("hashchange", () => { llegeixHash(); pinta(); });

llegeixHash();
pinta();
</script>

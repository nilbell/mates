<style>

  /* capçalera */
  .cap { position:sticky; top:0; z-index:20; height:var(--h); display:flex; align-items:center; gap:14px; padding:0 24px;
         background:linear-gradient(100deg,var(--fosc),var(--a) 70%,#4f8cff); color:#fff; box-shadow:0 2px 12px rgba(30,58,138,.35); }

  .app { display:grid; grid-template-columns:300px 1fr; min-height:calc(100vh - var(--h)); }
  aside { background:var(--surf); border-right:1px solid var(--line); padding:20px 18px; position:sticky; top:var(--h); height:calc(100vh - var(--h)); overflow:auto; }

function pintaTargeta(r) {
  const href = url(r.obrir);
  const extres = r.extres.map(e => `<a href="${esc(url(e.href))}"${nova(e.href)}>${esc(e.nom)}</a>`).join("");
  return `<article class="f">
    <a class="mini" href="${esc(href)}"${nova(href)} aria-label="Obre ${esc(r.titol)}">${r.imatge ? `<img loading="lazy" src="${esc(url(r.imatge))}" alt="">` : matIco(r.materia)}</a>
    <div>
      <h2>${esc(r.titol)}</h2>
      ${r.descripcio ? `<p>${esc(r.descripcio)}</p>` : ""}
      <span class="ins m">${esc(matNom[r.materia])}</span>${r.origen === "extern" ? `<span class="ins e">Recomanat</span>` : ""}<span class="ins">${esc(r.tipus)}</span>${r.nivells.map(n => `<span class="ins">${esc(n)}</span>`).join("")}
    </div>
    <div class="accions"><a class="btn" href="${esc(href)}"${nova(href)}>Obrir</a>${extres}</div>
  </article>`;
}

const R = D.recursos;
const MAT = { matematiques: { c: "#2f5fd0", i: "∑" }, fisica: { c: "#e07a1f", i: "⚛" }, quimica: { c: "#17a06a", i: "⚗" },
  "biologia-geologia": { c: "#0e8f8f", i: "✿" }, tutoria: { c: "#d6457b", i: "☺" } };
const matCol = id => (MAT[id] || { c: "#2f5fd0" }).c, matIco = id => (MAT[id] || { i: "•" }).i;
const estat = { q: "", mat: "", tema: "", niv: [], tipus: "", origen: "" };

const temaInfo = {};
D.materies.forEach(m => m.blocs.forEach(b => b.temes.forEach(t => {
  temaInfo[t.id] = { nom: t.nom, bloc: b.nom, materia: m.id };
})));
const matNom = Object.fromEntries(D.materies.map(m => [m.id, m.nom]));
const ordreMat = Object.fromEntries(D.materies.map((m, i) => [m.id, i]));
const ordreTema = {}; Object.keys(temaInfo).forEach((id, i) => ordreTema[id] = i);

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const url = h => /^https?:/.test(h) ? h : encodeURI(h);
const nova = h => /^https?:/.test(h) ? ' target="_blank" rel="noopener"' : ' target="_blank" rel="noopener"';

const textCerca = Object.fromEntries(R.map(r => [r.id, norm([
  r.titol, r.descripcio, r.autor, r.etiquetes.join(" "), r.temes.map(t => temaInfo[t].nom).join(" ")
].join(" "))]));

function coincideix(r, salta) {
  if (salta !== "q" && estat.q && !textCerca[r.id].includes(norm(estat.q))) return false;
  if (salta !== "mat" && estat.mat && r.materia !== estat.mat) return false;
  if (salta !== "tema" && estat.tema && !r.temes.includes(estat.tema)) return false;
  if (salta !== "niv" && estat.niv.length && !r.nivells.some(n => estat.niv.includes(n))) return false;
  if (salta !== "tipus" && estat.tipus && r.tipus !== estat.tipus) return false;
  if (salta !== "origen" && estat.origen && r.origen !== estat.origen) return false;
  return true;
}

function ordena(llista) {
  return llista.slice().sort((a, b) =>
    ordreMat[a.materia] - ordreMat[b.materia] || ordreTema[a.temes[0]] - ordreTema[b.temes[0]] ||
    D.nivells.indexOf(a.nivells[0]) - D.nivells.indexOf(b.nivells[0]) || a.titol.localeCompare(b.titol, "ca"));
}

function llegeixHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  estat.q = p.get("q") || ""; estat.mat = p.get("mat") || ""; estat.tema = p.get("tema") || "";
  estat.niv = (p.get("niv") || "").split(",").filter(Boolean);
  estat.tipus = p.get("tipus") || ""; estat.origen = p.get("origen") || "";
}
function escriuHash() {
  const p = new URLSearchParams();
  Object.entries({ ...estat, niv: estat.niv.join(",") }).forEach(([k, v]) => v && p.set(k, v));
  try { history.replaceState(null, "", p.toString() ? "#" + p : location.pathname + location.search); } catch (e) { /* marc restringit */ }
}

/* xip(text, n, premut, attr): cada model pot canviar l'aspecte amb la classe CSS «xip» */
function xip(text, n, premut, attr) {
  return `<button type="button" class="xip" aria-pressed="${premut}" ${attr}>${esc(text)}${n === null ? "" : `<small>${n}</small>`}</button>`;
}

function pintaFiltres() {
  if ($("materies")) $("materies").innerHTML =
    xip("Totes", R.filter(r => coincideix(r, "mat")).length, !estat.mat, 'data-mat=""') +
    D.materies.filter(m => R.some(r => r.materia === m.id)).map(m => xip(m.nom, R.filter(r => r.materia === m.id && coincideix(r, "mat")).length,
      estat.mat === m.id, `data-mat="${m.id}"`)).join("");
  if ($("nivells")) $("nivells").innerHTML = D.nivells.map(n => xip(n, R.filter(r => r.nivells.includes(n) && coincideix(r, "niv")).length,
    estat.niv.includes(n), `data-niv="${n}"`)).join("");
  if ($("tema")) {
    const compta = {}; R.filter(r => coincideix(r, "tema")).forEach(r => r.temes.forEach(t => compta[t] = (compta[t] || 0) + 1));
    const hiHa = new Set(); R.forEach(r => r.temes.forEach(t => hiHa.add(t)));  /* només temes que tenen algun recurs */
    const materies = D.materies.filter(m => (!estat.mat || m.id === estat.mat) && R.some(r => r.materia === m.id));
    $("tema").innerHTML = `<option value="">Tots els temes</option>` + materies.map(m => m.blocs.filter(b => b.temes.some(t => hiHa.has(t.id))).map(b =>
      `<optgroup label="${esc(estat.mat ? b.nom : m.nom + " · " + b.nom)}">` + b.temes.filter(t => hiHa.has(t.id)).map(t =>
        `<option value="${t.id}" ${compta[t.id] || estat.tema === t.id ? "" : "disabled"}>${esc(t.nom)} (${compta[t.id] || 0})</option>`
      ).join("") + `</optgroup>`).join("")).join("");
    $("tema").value = estat.tema;
  }
  if ($("tipus")) {
    $("tipus").innerHTML = `<option value="">Qualsevol tipus</option>` + D.tipus.map(t =>
      `<option value="${esc(t)}">${esc(t)} (${R.filter(r => r.tipus === t && coincideix(r, "tipus")).length})</option>`).join("");
    $("tipus").value = estat.tipus;
  }
  if ($("origen")) $("origen").value = estat.origen;
  if ($("q") && document.activeElement !== $("q")) $("q").value = estat.q;
}

function pinta() {
  pintaFiltres();
  const trobats = ordena(R.filter(r => coincideix(r)));
  if ($("resum")) $("resum").textContent = `${trobats.length} de ${R.length} recursos`;
  if (typeof pintaLlista === "function") pintaLlista(trobats);
  else $("graella").innerHTML = trobats.length ? trobats.map(pintaTargeta).join("") :
    `<div class="buit">Cap recurs amb aquests filtres.</div>`;
  escriuHash();
}

if ($("total")) $("total").textContent = `${R.length} recursos`;
if ($("q")) $("q").addEventListener("input", e => { estat.q = e.target.value; pinta(); });
["tema", "tipus", "origen"].forEach(id => { if ($(id)) $(id).addEventListener("change", e => { estat[id] = e.target.value; pinta(); }); });
if ($("materies")) $("materies").addEventListener("click", e => {
  const b = e.target.closest("[data-mat]"); if (!b) return;
  estat.mat = b.dataset.mat;
  if (estat.tema && estat.mat && temaInfo[estat.tema].materia !== estat.mat) estat.tema = "";
  pinta();
});
if ($("nivells")) $("nivells").addEventListener("click", e => {
  const b = e.target.closest("[data-niv]"); if (!b) return;
  const n = b.dataset.niv;
  estat.niv = estat.niv.includes(n) ? estat.niv.filter(x => x !== n) : [...estat.niv, n];
  pinta();
});
if ($("neteja")) $("neteja").addEventListener("click", () => {
  Object.assign(estat, { q: "", mat: "", tema: "", niv: [], tipus: "", origen: "" }); pinta();
});
window.addEventListener("hashchange", () => { llegeixHash(); pinta(); });
llegeixHash();
pinta();

</script>
